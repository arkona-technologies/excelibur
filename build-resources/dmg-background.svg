<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090b0c"/>
      <stop offset="58%" stop-color="#001734"/>
      <stop offset="100%" stop-color="#00224c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.22" r="0.9">
      <stop offset="0%" stop-color="#f8a335" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f8a335" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#grid)" opacity="0.22"/>
  <rect width="640" height="640" fill="url(#glow)"/>

  <g filter="url(#softShadow)">
    <rect x="24" y="24" width="592" height="412" rx="22" fill="#07131b" fill-opacity="0.82" stroke="#00aaff" stroke-opacity="0.28"/>
  </g>

  <g transform="translate(42 70)">
    <text x="0" y="0" fill="#ffffff" font-family="Lato, Arial, sans-serif" font-size="34" font-weight="700">Excelibur 2.9</text>
    <text x="0" y="36" fill="#c6cfda" font-family="Lato, Arial, sans-serif" font-size="18">Drag Excelibur into Applications to install.</text>
  </g>

  <g transform="translate(62 300)">
    <rect x="0" y="0" width="128" height="4" rx="2" fill="#f8a335"/>
    <rect x="0" y="12" width="220" height="2" rx="1" fill="#ffffff" fill-opacity="0.22"/>
  </g>

  <g>
    <circle cx="165" cy="314" r="74" fill="#00aaff" fill-opacity="0.10"/>
    <circle cx="475" cy="314" r="74" fill="#00aaff" fill-opacity="0.10"/>
    <circle cx="165" cy="314" r="52" fill="#f8a335" fill-opacity="0.08"/>
    <circle cx="475" cy="314" r="52" fill="#f8a335" fill-opacity="0.08"/>
  </g>

  <g opacity="0.95">
    <rect x="102" y="372" width="126" height="34" rx="17" fill="#f3f5f7"/>
    <rect x="398" y="372" width="154" height="34" rx="17" fill="#f3f5f7"/>
  </g>

  <g transform="translate(284 316)" fill="none" stroke="#f8a335" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.96">
    <path d="M0 0 H62"/>
    <path d="M34 -28 L62 0 L34 28"/>
  </g>
</svg>
